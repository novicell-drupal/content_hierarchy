content_hierarchy.hierarchy_settings:
  path: '/admin/content/hierarchy/settings'
  defaults:
    _form: '\Drupal\content_hierarchy\Form\ContentHierarchySettingsForm'
    _title: 'Content Hierarchy settings'
  requirements:
    _permission: 'administer content_hierarchy'

content_hierarchy.content_overview:
  path: '/admin/content/hierarchy'
  defaults:
    _form: '\Drupal\content_hierarchy\Form\ContentHierarchyOverviewForm'
    _title: 'Content Overview Page'
  requirements:
    _permission: 'access content overview'

content_hierarchy.select:
  path: '/admin/content/hierarchy/ajax/select/{langcode}/{current_lang}/{placement}'
  defaults:
    _controller: '\Drupal\content_hierarchy\Controller\ContentHierarchyController::contentHierarchySelect'
  requirements:
    _permission: 'access content overview'
