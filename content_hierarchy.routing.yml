content_hierarchy.hierarchy_settings:
  path: '/admin/content/hierarchy/settings'
  defaults:
    _form: '\Drupal\content_hierarchy\Form\ContentHierarchySettingsForm'
    _title: 'Content Hierarchy settings'
  requirements:
    _permission: 'administer content_hierarchy'

content_hierarchy.content_overview:
  path: '/admin/content/hierarchy'
  defaults:
    _form: '\Drupal\content_hierarchy\Form\ContentHierarchyOverviewForm'
    _title: 'Content hierarchy'
  requirements:
    _permission: 'access content overview'

content_hierarchy.content_sorting:
  path: '/admin/content/hierarchy/sorting'
  defaults:
    _form: '\Drupal\content_hierarchy\Form\ContentHierarchySortingForm'
    _title: 'Content sorting'
  requirements:
    _permission: 'access content overview'

content_hierarchy.select:
  path: '/admin/content/hierarchy/ajax/select/{langcode}/{current_lang}/{content_id}'
  defaults:
    _controller: '\Drupal\content_hierarchy\Controller\ContentHierarchyController::contentHierarchySelect'
  requirements:
    _permission: 'access content overview'

content_hierarchy.modal.form:
  path: '/admin/content/hierarchy/ajax/modal/form'
  defaults:
    _form: '\Drupal\content_hierarchy\Form\ContentHierarchyModalForm'
    _title: 'Choose placement'
  requirements:
    _permission: 'access content overview'

content_hierarchy.modal.update:
  path: '/admin/content/hierarchy/ajax/modal/update/{langcode}/{content_id}'
  defaults:
    _controller: '\Drupal\content_hierarchy\Controller\ContentHierarchyController::contentHierarchyModalUpdate'
  requirements:
    _permission: 'access content overview'

content_hierarchy.modal.open:
  path: '/admin/content/hierarchy/ajax/modal/open/{id}/{langcode}/{content_id}'
  defaults:
    _controller: '\Drupal\content_hierarchy\Controller\ContentHierarchyController::contentHierarchyModalOpen'
  requirements:
    _permission: 'access content overview'

content_hierarchy.modal.close:
  path: '/admin/content/hierarchy/ajax/modal/close/{id}/{langcode}/{content_id}'
  defaults:
    _controller: '\Drupal\content_hierarchy\Controller\ContentHierarchyController::contentHierarchyModalClose'
  requirements:
    _permission: 'access content overview'

content_hierarchy.modal.select:
  path: '/admin/content/hierarchy/ajax/modal/select/{id}/{langcode}/{content_id}'
  defaults:
    _controller: '\Drupal\content_hierarchy\Controller\ContentHierarchyController::contentHierarchyModalSelect'
  requirements:
    _permission: 'access content overview'
