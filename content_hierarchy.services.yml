services:
  content_hierarchy.data:
    class: Drupal\content_hierarchy\ContentHierarchyData
    arguments: ['@database', '@cache.content_hierarchy', '@language_manager', '@module_handler']

  content_hierarchy.storage:
    class: Drupal\content_hierarchy\ContentHierarchyStorage
    arguments: ['@content_hierarchy.data', '@cache.content_hierarchy', '@entity_type.manager', '@cache_context.user.permissions', '@module_handler']

  content_hierarchy.widgets:
    class: Drupal\content_hierarchy\ContentHierarchyWidgets
    arguments: ['@content_hierarchy.storage', '@entity_type.manager', '@entity_type.bundle.info', '@content_hierarchy.data', '@renderer']

  cache.content_hierarchy:
    class: Drupal\Core\Cache\CacheBackendInterface
    tags:
      - { name: cache.bin }
    factory: cache_factory:get
    arguments: [content_hierarchy]
